name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.0)'
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: write
    uses: markpollack/build-tools/.github/workflows/maven-central-release.yml@35297f1ade5f47c2925d6dab42a7e2d43bd734d0
    with:
      version: ${{ inputs.version }}
      # Explicit rather than inherited: the Claude and Gemini modules bind Java 21 SDKs, so the
      # release build must not drift with the reusable workflow's default.
      java-version: '21'
      # Curated notes are the GitHub Release body. The reusable workflow requires this to
      # name one tracked ordinary file; without it the body falls back to a raw commit log.
      release-notes-file: RELEASE_NOTES_1.8.md
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
