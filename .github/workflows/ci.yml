name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a release candidate be built at its exact SHA on its own branch, without
  # pushing to main and without publishing a snapshot. Dispatch with
  # `gh workflow run ci.yml --ref <branch>`; GitHub only offers workflow_dispatch
  # once this trigger is present on the default branch.
  workflow_dispatch:

jobs:
  build:
    uses: markpollack/build-tools/.github/workflows/ci-build.yml@35297f1ade5f47c2925d6dab42a7e2d43bd734d0
    with:
      # 21: claude-code-sdk 1.1.0+ artifacts are Java 21 builds (class file 65.0);
      # compiling against them on a 17 JDK fails with "bad class file".
      # CI Build had been red since 2026-05-15 because of this.
      java-version: '21'

  consumer-resolution:
    name: Standalone consumer resolution
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Verify standalone consumer dependency floors
        run: ./scripts/check-consumer-resolution.py
