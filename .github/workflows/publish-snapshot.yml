name: Publish Snapshot

# Manual publication on demand. A push to main publishes through ci.yml's publish job, gated on that run's build
# and standalone consumer resolution passing for the same commit.
on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    uses: markpollack/build-tools/.github/workflows/publish-snapshot.yml@35297f1ade5f47c2925d6dab42a7e2d43bd734d0
    with:
      # Tests run before every snapshot publish. Skipping them meant snapshot consumers
      # pulled artifacts no test had ever exercised on the publishing commit.
      java-version: '21'
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
