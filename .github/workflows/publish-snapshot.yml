name: Publish Snapshot

# main is the development line of 2.0: every push to it that changes more than docs publishes a
# 2.0.0-SNAPSHOT, so consumers get each fix as it lands. A dispatch publishes the branch head on demand.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    uses: markpollack/build-tools/.github/workflows/publish-snapshot.yml@35297f1ade5f47c2925d6dab42a7e2d43bd734d0
    with:
      # Tests run before every snapshot publish. Skipping them meant snapshot consumers
      # pulled artifacts no test had ever exercised on the publishing commit.
      java-version: '21'
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
